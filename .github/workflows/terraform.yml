name: Terraform

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        type: choice
        options:
          - dev
          - stag
          - prod
        required: true
        default: dev

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # dev and stag.
  #   pull_request: dev and stag, same-repo PRs only (forks get no OIDC token or secrets).
  #   workflow_dispatch: only the chosen environment, and only if it is dev or stag.
  #   push: not run.
  plan-dev-stag:
    name: plan-${{ matrix.environment }}
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment != 'prod')
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.environment) || '["dev","stag"]') }}
    uses: ./.github/workflows/terraform-env.yml
    with:
      environment: ${{ matrix.environment }}
      suffix: ${{ matrix.environment == 'dev' && 'DEV' || 'STAG' }}
    secrets:
      tf_vars: ${{ matrix.environment == 'dev' && secrets.TF_VARS_DEV || secrets.TF_VARS_STAG }}

  # prod. This job-level condition is the prod guard:
  #   github.ref == 'refs/heads/main'  -> never from a PR ref or any other branch
  #   AND (push, or dispatch with environment == prod)
  # pull_request is not in the event list, and a PR's github.ref is refs/pull/N/merge.
  plan-prod:
    name: plan-prod
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'))
    uses: ./.github/workflows/terraform-env.yml
    with:
      environment: prod
      suffix: PROD
    secrets:
      tf_vars: ${{ secrets.TF_VARS_PROD }}
