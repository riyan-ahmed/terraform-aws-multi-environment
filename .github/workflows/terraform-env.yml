# Reusable workflow: fmt, validate and plan for ONE environment.
# Called by terraform.yml. Never runs terraform apply.
name: Terraform environment (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: Environment directory under environments/ (dev, stag or prod)
        required: true
        type: string
      suffix:
        description: Upper-case environment name used to pick AWS_ROLE_ARN_<SUFFIX> and TF_VARS_<SUFFIX>
        required: true
        type: string
    secrets:
      tf_vars:
        description: Contents of a tfvars file for this environment (TF_VARS_<SUFFIX>)
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          # The wrapper adds output to stdout, which would corrupt `terraform show -json`.
          terraform_wrapper: false

      # Runs from the repository root so modules/ is checked as well as this environment.
      - name: terraform fmt
        working-directory: .
        run: terraform fmt -check -recursive

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', inputs.suffix)] }}
          aws-region: eu-west-2

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      # The variables have no defaults, so values come from a repository secret.
      # The file lives in RUNNER_TEMP, outside the repo checkout, and is deleted in the last step.
      - name: Write tfvars from secret
        id: tfvars
        env:
          TF_VARS: ${{ secrets.tf_vars }}
        run: |
          if [ -z "$TF_VARS" ]; then
            echo "::warning::Secret TF_VARS_${{ inputs.suffix }} is empty or unavailable; planning without a var file."
            echo "file=" >> "$GITHUB_OUTPUT"
          else
            umask 077
            printf '%s\n' "$TF_VARS" > "$RUNNER_TEMP/ci.tfvars"
            echo "file=$RUNNER_TEMP/ci.tfvars" >> "$GITHUB_OUTPUT"
          fi

      - name: terraform plan
        env:
          VAR_FILE: ${{ steps.tfvars.outputs.file }}
        run: |
          args=(-input=false -no-color -lock-timeout=60s -out=tfplan)
          if [ -n "$VAR_FILE" ]; then args+=("-var-file=$VAR_FILE"); fi
          terraform plan "${args[@]}"

      - name: Count planned changes
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          terraform show -json tfplan > "$RUNNER_TEMP/tfplan.json"
          python3 - <<'PY'
          import json, os

          env = os.environ["ENVIRONMENT"]
          plan = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "tfplan.json")))
          counts = {"create": 0, "update": 0, "delete": 0, "replace": 0}
          for rc in plan.get("resource_changes", []):
              actions = rc["change"]["actions"]
              if "create" in actions and "delete" in actions:
                  counts["replace"] += 1  # replacement counts as one create and one delete
              for a in ("create", "update", "delete"):
                  if a in actions:
                      counts[a] += 1
          summary = {"environment": env, **counts}
          with open(os.path.join(os.environ["GITHUB_WORKSPACE"], f"summary-{env}.json"), "w") as f:
              json.dump(summary, f, indent=2)
          line = (f"| {env} | {counts['create']} | {counts['update']} | "
                  f"{counts['delete']} | {counts['replace']} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("| Environment | Create | Update | Delete | Of which replace |\n")
              f.write("|---|---|---|---|---|\n" + line + "\n")
          print(summary)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: plan-summary-${{ inputs.environment }}
          path: summary-${{ inputs.environment }}.json
          if-no-files-found: error

      - name: Delete tfvars and plan files
        if: always()
        run: rm -f "$RUNNER_TEMP/ci.tfvars" "$RUNNER_TEMP/tfplan.json" tfplan
